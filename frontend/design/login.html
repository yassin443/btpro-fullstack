<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planner — Connexion</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#1100FF', dark: '#0D00CC', deep: '#0A00A8' },
          ink: '#0B0B14', muted: '#5B5B6B', faint: '#8A8A99', hair: '#ECECF2', mist: '#F8F7FC',
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
        },
        borderRadius: { card: '14px' },
        boxShadow: {
          soft: '0 1px 2px rgba(11,11,20,0.04), 0 8px 24px -12px rgba(11,11,20,0.10)',
          lift: '0 1px 2px rgba(11,11,20,0.05), 0 24px 48px -20px rgba(17,0,255,0.18)',
          glow: '0 0 0 1px rgba(17,0,255,0.10), 0 30px 70px -28px rgba(17,0,255,0.30)',
        },
      },
    },
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap');
  :root { --brand: #1100FF; }
  *, html, body, button, input, textarea, select { font-family: 'Plus Jakarta Sans', sans-serif; }
  * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { background: #FFFFFF; color: #0B0B14; overflow-x: hidden; font-feature-settings: "ss01" on; }
  ::selection { background: rgba(17,0,255,0.16); }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum" on; }

  .blueprint-bg {
    background-image:
      linear-gradient(to right, rgba(17,0,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,0,255,0.045) 1px, transparent 1px);
    background-size: 38px 38px;
  }
  .blueprint-fade {
    -webkit-mask-image: radial-gradient(120% 90% at 30% 10%, #000 30%, transparent 80%);
            mask-image: radial-gradient(120% 90% at 30% 10%, #000 30%, transparent 80%);
  }
  .igrid-cell { transition: background-color .45s ease, box-shadow .45s ease; }
  .igrid-cell:hover { background-color: rgba(17,0,255,0.06); box-shadow: inset 0 0 0 1px rgba(17,0,255,0.12); transition: background-color .05s ease; }

  .reveal { opacity: 0; transform: translateY(16px); filter: blur(8px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1), filter .8s ease; will-change: opacity, transform, filter; }
  .reveal.is-in { opacity: 1; transform: none; filter: none; }

  .tap-ring:focus-visible { outline: 2px solid #1100FF; outline-offset: 2px; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
  @keyframes step-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
    .animate-\[shake_\.4s_ease\] { animation: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>

  <script type="text/babel" src="components/ui.jsx"></script>
  <script type="text/babel" src="components/auth-ui.jsx"></script>
  <script type="text/babel" src="components/login.jsx"></script>
</body>
</html>
