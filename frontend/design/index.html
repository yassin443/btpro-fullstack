<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#1100FF', dark: '#0D00CC', deep: '#0A00A8' },
          ink: '#0B0B14',
          muted: '#5B5B6B',
          faint: '#8A8A99',
          hair: '#ECECF2',
          mist: '#F8F7FC',
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
        },
        borderRadius: { card: '14px' },
        boxShadow: {
          soft: '0 1px 2px rgba(11,11,20,0.04), 0 8px 24px -12px rgba(11,11,20,0.10)',
          lift: '0 1px 2px rgba(11,11,20,0.05), 0 24px 48px -20px rgba(17,0,255,0.18)',
          glow: '0 0 0 1px rgba(17,0,255,0.10), 0 30px 70px -28px rgba(17,0,255,0.30)',
        },
      },
    },
  };
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap');
  :root { --brand: #1100FF; }
  *, html, body, button, input, textarea, select { font-family: 'Plus Jakarta Sans', sans-serif; }
  * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html { scroll-behavior: smooth; }
  body { background: #FFFFFF; color: #0B0B14; overflow-x: hidden; font-feature-settings: "ss01" on; }
  ::selection { background: rgba(17,0,255,0.16); }
  .font-mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: "tnum" on; }

  /* ---------- Blueprint grid ---------- */
  .blueprint-bg {
    background-image:
      linear-gradient(to right, rgba(17,0,255,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(17,0,255,0.045) 1px, transparent 1px);
    background-size: 38px 38px;
  }
  .blueprint-fade {
    -webkit-mask-image: radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 78%);
            mask-image: radial-gradient(120% 100% at 50% 0%, #000 35%, transparent 78%);
  }

  /* interactive grid cells */
  .igrid-cell { transition: background-color .45s ease, box-shadow .45s ease; }
  .igrid-cell:hover { background-color: rgba(17,0,255,0.06); box-shadow: inset 0 0 0 1px rgba(17,0,255,0.12); transition: background-color .05s ease; }

  /* ---------- Reveal (blur-fade-up) ---------- */
  .reveal { opacity: 0; transform: translateY(18px); filter: blur(8px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1), filter .8s ease; will-change: opacity, transform, filter; }
  .reveal.is-in { opacity: 1; transform: none; filter: none; }

  /* ---------- Border beam ---------- */
  .beam-wrap { position: relative; }
  .beam-comet {
    position: absolute; top: 0; left: 0;
    width: 200px; height: 2px; border-radius: 99px;
    background: linear-gradient(90deg, transparent, rgba(17,0,255,0), #1100FF 50%, #7a6bff 70%, transparent);
    box-shadow: 0 0 14px 1px rgba(17,0,255,0.55);
    offset-path: rect(0 100% 100% 0);
    offset-rotate: auto;
    offset-distance: 0%;
    animation: beam-travel var(--beam-dur, 7s) linear infinite;
    pointer-events: none;
  }
  @keyframes beam-travel { to { offset-distance: 100%; } }

  /* ---------- Marquee ---------- */
  @keyframes marquee-x { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
             mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .marquee-track { display: flex; width: max-content; animation: marquee-x 34s linear infinite; }
  .marquee:hover .marquee-track { animation-play-state: paused; }

  /* ---------- Step connector ---------- */
  @keyframes dash-flow { to { background-position: -200px 0; } }
  .step-line {
    background-image: linear-gradient(90deg, rgba(17,0,255,0.35) 0 10px, transparent 10px 20px);
    background-size: 20px 100%;
    animation: dash-flow 3.5s linear infinite;
  }

  /* ---------- Misc ---------- */
  button { -webkit-tap-highlight-color: transparent; }
  .tap-ring:focus-visible { outline: 2px solid #1100FF; outline-offset: 2px; }
  details summary::-webkit-details-marker { display: none; }
  @keyframes float-soft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .float-soft { animation: float-soft 6s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; filter: none !important; transition: none !important; }
    .beam-comet, .marquee-track, .step-line, .float-soft { animation: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/pricing.jsx"></script>

  <script type="text/babel" src="components/app.jsx"></script>
</body>
</html>
